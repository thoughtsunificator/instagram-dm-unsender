name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    steps:
      - name: git-checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ecmascript

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish userscript branch
        run: |
          publish_dir="$(mktemp -d)"
          cp -R dist/. "$publish_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan userscript-publish
          git rm -rf .
          cp -R "$publish_dir"/. .
          git add idmu.user.js
          git commit -m "chore(release): publish userscript ${GITHUB_REF_NAME}"
          git push --force origin HEAD:userscript

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./dist/idmu.user.js \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME"
